<svg width="1240" height="1020" viewBox="0 0 1240 1020" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B212C"/>
      <stop offset="1" stop-color="#151A23"/>
    </linearGradient>
    <linearGradient id="cardBgSelected" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#27344D"/>
      <stop offset="1" stop-color="#1F2A3F"/>
    </linearGradient>
    <linearGradient id="popoverBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#222A38"/>
      <stop offset="1" stop-color="#1A2030"/>
    </linearGradient>
    <linearGradient id="modalBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1F2734"/>
      <stop offset="1" stop-color="#171D28"/>
    </linearGradient>
    <filter id="surfShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <style>
      .title { font: 700 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #E7EDF7; }
      .subtitle { font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #94A3BA; }
      .sectionTitle { font: 700 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0.18em; text-transform: uppercase; fill: #C8D2E4; }
      .panelLabel { font: 700 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0.16em; text-transform: uppercase; fill: #6A7689; }

      .wtName { font: 700 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #E7EDF7; }
      .wtNameMuted { font: 700 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #94A3BA; }
      .session { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #C8D2E4; }
      .sessionMuted { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #6A7689; }
      .hint { font: 500 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #6A7689; }

      .cellLabel { font: 700 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #C8D2E4; }
      .cellNote { font: 500 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #94A3BA; }

      .modalTitle { font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #E7EDF7; }
      .modalSub { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #94A3BA; }
      .modalLabel { font: 700 10px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0.18em; text-transform: uppercase; fill: #6A7689; }
      .rowMain { font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #E7EDF7; }
      .rowMeta { font: 500 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #6A7689; }

      .annot { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #94A3BA; }
      .annotStrong { font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #C8D2E4; }
    </style>
  </defs>

  <rect width="1240" height="1020" fill="#0B0F15"/>

  <!-- Header -->
  <text x="48" y="50" class="title">V2 — left pane design</text>
  <text x="48" y="74" class="subtitle">card summary states · popover action surface · click contract</text>

  <!-- ============================================================
       SECTION 1: CARD STATES
       ============================================================ -->
  <g transform="translate(48 110)">
    <text x="0" y="0" class="sectionTitle">1 · Card states</text>

    <!-- Row 1 -->
    <!-- Cell: has primary · active · selected -->
    <g transform="translate(0 24)">
      <rect width="360" height="60" rx="10" fill="url(#cardBgSelected)" stroke="#5BA3F5" stroke-width="1.5"/>
      <text x="14" y="22" class="wtName">work-0507-0137</text>
      <circle cx="22" cy="42" r="5" fill="#5BA3F5"/>
      <text x="34" y="46" class="session">hello</text>
    </g>
    <text x="0" y="106" class="cellLabel">has primary · active · selected</text>
    <text x="0" y="122" class="cellNote">card 全体がハイライト</text>

    <!-- Cell: has primary · active -->
    <g transform="translate(388 24)">
      <rect width="360" height="60" rx="10" fill="url(#cardBg)" stroke="#2A3242" stroke-width="1"/>
      <text x="14" y="22" class="wtName">work-0507-0140</text>
      <circle cx="22" cy="42" r="5" fill="#5BA3F5"/>
      <text x="34" y="46" class="session">refactor SessionView naming</text>
    </g>
    <text x="388" y="106" class="cellLabel">has primary · active</text>
    <text x="388" y="122" class="cellNote">通常の主導線</text>

    <!-- Cell: has primary · inactive -->
    <g transform="translate(776 24)">
      <rect width="360" height="60" rx="10" fill="url(#cardBg)" stroke="#2A3242" stroke-width="1"/>
      <text x="14" y="22" class="wtName">work-0506-2210</text>
      <circle cx="22" cy="42" r="5" fill="#3D5A78"/>
      <text x="34" y="46" class="sessionMuted">fix diff loading flicker</text>
    </g>
    <text x="776" y="106" class="cellLabel">has primary · inactive</text>
    <text x="776" y="122" class="cellNote">色を落として判別</text>

    <!-- Row 2 -->
    <!-- Cell: no primary · 1 existing -->
    <g transform="translate(0 156)">
      <rect width="360" height="48" rx="10" fill="url(#cardBg)" stroke="#2A3242" stroke-width="1"/>
      <text x="14" y="22" class="wtName">v2-step-15</text>
      <text x="14" y="38" class="hint">1 existing session</text>
    </g>
    <text x="0" y="226" class="cellLabel">no primary · 1 existing</text>
    <text x="0" y="242" class="cellNote">クリックで Start Session を開く</text>

    <!-- Cell: no primary · 2 existing -->
    <g transform="translate(388 156)">
      <rect width="360" height="48" rx="10" fill="url(#cardBg)" stroke="#2A3242" stroke-width="1"/>
      <text x="14" y="22" class="wtName">step-15-worktree-lifecycle</text>
      <text x="14" y="38" class="hint">2 existing sessions</text>
    </g>
    <text x="388" y="226" class="cellLabel">no primary · 複数 existing</text>
    <text x="388" y="242" class="cellNote">行数は変わらず数だけ増える</text>

    <!-- Cell: no primary · empty -->
    <g transform="translate(776 156)">
      <rect width="360" height="48" rx="10" fill="url(#cardBg)" stroke="#2A3242" stroke-width="1"/>
      <text x="14" y="22" class="wtName">work-0507-0149</text>
      <text x="14" y="38" class="hint">empty</text>
    </g>
    <text x="776" y="226" class="cellLabel">no primary · empty</text>
    <text x="776" y="242" class="cellNote">クリックで NEW のみの surface</text>

    <!-- Rule note -->
    <g transform="translate(0 268)">
      <rect width="1136" height="60" rx="10" fill="#10161F" stroke="#1F2733" stroke-width="1"/>
      <text x="16" y="22" class="annotStrong">サマリ行のルール</text>
      <text x="16" y="42" class="annot">has primary: ● + session preview ／ no primary + suggested: "N existing session(s)" ／ no primary + empty: "empty"</text>
      <text x="16" y="56" class="annot">カード本体に + New session ボタンは出さない。アクションは action surface 側に集約する。</text>
    </g>
  </g>

  <!-- ============================================================
       SECTION 2: ACTION SURFACE (POPOVER)
       ============================================================ -->
  <g transform="translate(48 510)">
    <text x="0" y="0" class="sectionTitle">2 · Action surface — popover</text>
    <text x="0" y="20" class="annot">no primary card をクリックすると、その card の右側にアンカーされて開く</text>

    <!-- ===== Scenario 1: WITH EXISTING SESSION ===== -->
    <g transform="translate(0 40)">
      <rect width="556" height="280" rx="12" fill="#0E141C" stroke="#1F2733" stroke-width="1"/>

      <text x="20" y="32" class="panelLabel">SCENARIO · 1 EXISTING SESSION</text>

      <!-- mini pane (anchor card alone) -->
      <g transform="translate(20 50)">
        <rect width="220" height="80" rx="10" fill="#0E141C" stroke="#1F2733" stroke-width="1"/>
        <text x="14" y="22" class="panelLabel">REPOS</text>

        <!-- anchor card -->
        <g transform="translate(10 30)">
          <rect width="200" height="40" rx="8" fill="url(#cardBg)" stroke="#5BA3F5" stroke-width="1.2" stroke-dasharray="3 3"/>
          <text x="12" y="18" class="wtName">v2-step-15</text>
          <text x="12" y="32" class="hint">1 existing session</text>
        </g>
      </g>

      <!-- popover -->
      <g transform="translate(264 60)" filter="url(#surfShadow)">
        <rect width="272" height="144" rx="10" fill="url(#popoverBg)" stroke="#3A4863" stroke-width="1"/>
        <path d="M 0 12 L -7 18 L 0 24 Z" fill="#222A38" stroke="#3A4863" stroke-width="1"/>

        <text x="14" y="24" class="modalLabel">EXISTING SESSION</text>
        <g transform="translate(8 32)">
          <rect width="256" height="36" rx="8" fill="#27344D"/>
          <circle cx="20" cy="18" r="5" fill="#E89B4A"/>
          <text x="32" y="16" style="fill: #E7EDF7; font-weight: 500; font-size: 11px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;">新規 worktree を切って…</text>
          <text x="32" y="30" class="rowMeta">claude · 2h ago</text>
        </g>

        <text x="14" y="92" class="modalLabel">NEW SESSION</text>
        <g transform="translate(8 100)">
          <circle cx="20" cy="18" r="5" fill="#5BA3F5"/>
          <text x="32" y="22" class="rowMain">claude</text>
        </g>
        <g transform="translate(140 100)">
          <circle cx="20" cy="18" r="5" fill="#E89B4A"/>
          <text x="32" y="22" class="rowMain">codex</text>
        </g>
      </g>

      <!-- notes -->
      <g transform="translate(20 224)">
        <text x="0" y="14" class="annot">· 既存セッション行をクリック → primary に昇格</text>
        <text x="0" y="34" class="annot">· NEW SESSION で claude / codex をその場で開始</text>
      </g>
    </g>

    <!-- ===== Scenario 2: EMPTY ===== -->
    <g transform="translate(580 40)">
      <rect width="556" height="280" rx="12" fill="#0E141C" stroke="#1F2733" stroke-width="1"/>

      <text x="20" y="32" class="panelLabel">SCENARIO · EMPTY</text>

      <!-- mini pane (anchor card alone) -->
      <g transform="translate(20 50)">
        <rect width="220" height="80" rx="10" fill="#0E141C" stroke="#1F2733" stroke-width="1"/>
        <text x="14" y="22" class="panelLabel">REPOS</text>

        <!-- anchor card -->
        <g transform="translate(10 30)">
          <rect width="200" height="40" rx="8" fill="url(#cardBg)" stroke="#5BA3F5" stroke-width="1.2" stroke-dasharray="3 3"/>
          <text x="12" y="18" class="wtName">work-0507-0149</text>
          <text x="12" y="32" class="hint">empty</text>
        </g>
      </g>

      <!-- popover (NEW only — much smaller) -->
      <g transform="translate(264 76)" filter="url(#surfShadow)">
        <rect width="272" height="76" rx="10" fill="url(#popoverBg)" stroke="#3A4863" stroke-width="1"/>
        <path d="M 0 12 L -7 18 L 0 24 Z" fill="#222A38" stroke="#3A4863" stroke-width="1"/>

        <text x="14" y="24" class="modalLabel">NEW SESSION</text>
        <g transform="translate(8 32)">
          <circle cx="20" cy="18" r="5" fill="#5BA3F5"/>
          <text x="32" y="22" class="rowMain">claude</text>
        </g>
        <g transform="translate(140 32)">
          <circle cx="20" cy="18" r="5" fill="#E89B4A"/>
          <text x="32" y="22" class="rowMain">codex</text>
        </g>
      </g>

      <!-- notes -->
      <g transform="translate(20 224)">
        <text x="0" y="14" class="annot">· EXISTING SESSION セクションは出さない</text>
        <text x="0" y="34" class="annot">· popover は claude / codex の 2 行分まで縮む</text>
      </g>
    </g>
  </g>

  <!-- ============================================================
       SECTION 3: CLICK CONTRACT
       ============================================================ -->
  <g transform="translate(48 870)">
    <text x="0" y="0" class="sectionTitle">3 · Click contract</text>
    <g transform="translate(0 16)">
      <rect width="1136" height="100" rx="10" fill="#10161F" stroke="#1F2733" stroke-width="1"/>
      <text x="16" y="24" class="annot">· has primary card → primary session を選択（カードがハイライト、右ペインに反映）</text>
      <text x="16" y="44" class="annot">· no primary card → popover を開く（選択は動かさない）</text>
      <text x="16" y="64" class="annot">· EXISTING SESSION 行 → クリック即昇格して primary に。popover は閉じ、card がハイライトに切り替わる</text>
      <text x="16" y="84" class="annot">· NEW SESSION (claude / codex) → 新規 session を開始、開始した session が primary になり選択される</text>
    </g>
  </g>
</svg>
